  <circle cx="310" cy="80" r="1.4"/><circle cx="360" cy="140" r="2.0"/><circle cx="430" cy="100" r="1.5"/>
  <circle cx="510" cy="76" r="1.7"/><circle cx="580" cy="126" r="1.3"/><circle cx="648" cy="86" r="1.4"/>
  <circle cx="760" cy="120" r="1.8"/><circle cx="810" cy="72" r="1.5"/><circle cx="880" cy="150" r="1.3"/>
