    <rect x="-287" y="207" width="8" height="14"/><rect x="-260" y="207" width="8" height="14"/>
    <rect x="-182" y="178" width="8" height="15"/><rect x="-154" y="178" width="8" height="15"/>
    <rect x="-125" y="178" width="8" height="15"/><rect x="-96" y="178" width="8" height="15"/>
    <rect x="-37" y="141" width="8" height="16"/><rect x="-9" y="141" width="8" height="16"/>
