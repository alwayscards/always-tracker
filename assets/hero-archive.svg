<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#061120"/>
    <stop offset="0.45" stop-color="#0a1c31"/>
    <stop offset="0.72" stop-color="#101726"/>
    <stop offset="1" stop-color="#07090d"/>
  </linearGradient>
  <radialGradient id="moonGlow" cx="0.18" cy="0.18" r="0.20">
    <stop offset="0" stop-color="#f7efc0" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#d8caa0" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#d8caa0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8ab2c8" stop-opacity="0"/>
    <stop offset="1" stop-color="#8ab2c8" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a2132"/>
    <stop offset="1" stop-color="#04070b"/>
  </linearGradient>
  <linearGradient id="castleMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17263a"/>
    <stop offset="1" stop-color="#0a111a"/>
  </linearGradient>
  <linearGradient id="castleSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22334b"/>
    <stop offset="1" stop-color="#0b121b"/>
  </linearGradient>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect width="1600" height="900" fill="url(#moonGlow)"/>
<circle cx="250" cy="165" r="54" fill="#f5edbf"/>
<circle cx="250" cy="165" r="95" fill="#f5edbf" opacity="0.16" filter="url(#softGlow)"/>

<!-- stars -->
<g fill="#f3d896" opacity="0.95">
